name: Perl CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "Perl ${{ matrix.perl }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MIN_PERL_VERSION is 5.010; very old releases are hard to build on
        # current runners, so cover the maintained range plus the newest.
        perl: ['5.18', '5.24', '5.30', '5.36', '5.40']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          version: ${{ matrix.perl }}

      - name: Install dependencies
        run: cpanm --installdeps --notest .

      # Install the license renderer with Minilla: gpl_2 in minil.toml is
      # resolved via Software::License::GPL_2, which is not a prereq of
      # this dist so --installdeps never pulls it.
      - name: Install Minilla (dev tool that builds the release tarball)
        run: cpanm --notest Minilla Software::License::GPL_2

      - name: Build
        run: |
          perl Makefile.PL
          make

      # Exactly what a user's `cpanm Protocol::IR::Code` runs. Only install-time
      # tests must pass here; author tests are skipped (AUTHOR_TESTING unset).
      - name: Install-mode tests
        run: make test

      # Author/release checks: POD validity, MANIFEST in sync, version
      # consistency. These must pass in PRs but are meaningless at install.
      - name: Author tests
        env:
          AUTHOR_TESTING: '1'
        run: make test

      # Prove the Minilla-built tarball (the artifact `minil release` uploads)
      # compiles from the gathered file set.
      - name: Verify Minilla distribution tarball
        run: minil dist --no-test