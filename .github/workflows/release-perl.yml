name: Release distribution

# Triggered by a tag like `v0.08` (pushed by `minil release` on the
# maintainer's machine). Rebuilds the distribution with Minilla from the
# tagged source, runs the full test suite (author tests included), checks
# the tag matches the distribution version, and attaches the built tarball
# to a GitHub Release.
#
# The PAUSE/CPAN upload is intentionally NOT done here: it needs ~/.pause
# credentials that only live on the maintainer's machine, so `minil release`
# handles it (and pushes this tag). That means the tarball attached here and
# the one uploaded to PAUSE are built from the same minil.toml and the same
# tracked source, so they carry identical contents — this workflow just makes
# the same distribution downloadable from GitHub. No secrets required.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: "Distribution ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          version: '5.38'

      - name: Install dependencies
        run: cpanm --installdeps --notest .

      - name: Install Minilla
        run: cpanm --notest Minilla

      # minil test enables AUTHOR_TESTING by default, so the author checks
      # (POD validity, MANIFEST sync, version consistency) run too.
      - name: Build and test
        run: minil test

      - name: Check tag matches distribution version
        run: |
          version="$(perl -Ilib -MProtocol::IR::Code -e 'print $Protocol::IR::Code::VERSION')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "error: tag '$GITHUB_REF_NAME' does not match dist version $version" >&2
            exit 1
          fi

      - name: Build distribution tarball
        run: minil dist --no-test

      - name: Attach tarball to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Protocol-IR-Code-*.tar.gz
