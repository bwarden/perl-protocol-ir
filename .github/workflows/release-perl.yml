name: Release to CPAN

# Triggered by a tag like `v0.03`. Builds the distribution, runs the full
# test suite (including author tests) and `make disttest`, then uploads the
# tarball to PAUSE.
#
# Requires two repository secrets:
#   PAUSE_USER      your PAUSE ID
#   PAUSE_PASSWORD  your PAUSE API token (see PAUSE account settings)
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: "Release ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perl
    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: perl-actions/setup-perl@v2
        with:
          version: '5.38'

      - name: Install dependencies
        run: cpanm --installdeps --notest .

      - name: Build and test
        env:
          AUTHOR_TESTING: '1'
        run: |
          perl Makefile.PL
          make
          make test
          make disttest

      - name: Check tag matches distribution version
        run: |
          version="$(perl -Ilib -MIR::Code -e 'print $IR::Code::VERSION')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "error: tag '$GITHUB_REF_NAME' does not match dist version $version" >&2
            exit 1
          fi

      - name: Build distribution tarball
        run: make dist

      - name: Upload to PAUSE
        env:
          PAUSE_USER: ${{ secrets.PAUSE_USER }}
          PAUSE_PASSWORD: ${{ secrets.PAUSE_PASSWORD }}
        run: |
          test -n "$PAUSE_USER"     || { echo 'secret PAUSE_USER is not set' >&2; exit 1; }
          test -n "$PAUSE_PASSWORD" || { echo 'secret PAUSE_PASSWORD is not set' >&2; exit 1; }
          cpanm --notest CPAN::Uploader
          cpan-upload --user "$PAUSE_USER" --password "$PAUSE_PASSWORD" IR-Code-*.tar.gz
