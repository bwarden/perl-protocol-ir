name: Release to CPAN

# Triggered by a tag like `v0.08`. Builds the distribution, runs the full
# test suite (including author tests), then uploads the Minilla-built
# tarball to PAUSE.
#
# Requires two repository secrets:
#   PAUSE_USER      your PAUSE ID
#   PAUSE_PASSWORD  your PAUSE API token (see PAUSE account settings)
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: "Release ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v2
        with:
          version: '5.38'

      - name: Install dependencies
        run: cpanm --installdeps --notest .

      - name: Install Minilla
        run: cpanm --notest Minilla

      # minil test enables AUTHOR_TESTING by default, so the author checks
      # (POD validity, MANIFEST sync, version consistency) run too.
      - name: Build and test
        run: minil test

      - name: Check tag matches distribution version
        run: |
          version="$(perl -Ilib -MProtocol::IR::Code -e 'print $Protocol::IR::Code::VERSION')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "error: tag '$GITHUB_REF_NAME' does not match dist version $version" >&2
            exit 1
          fi

      - name: Build distribution tarball
        run: minil dist --no-test

      - name: Upload to PAUSE
        env:
          PAUSE_USER: ${{ secrets.PAUSE_USER }}
          PAUSE_PASSWORD: ${{ secrets.PAUSE_PASSWORD }}
        run: |
          test -n "$PAUSE_USER"     || { echo 'secret PAUSE_USER is not set' >&2; exit 1; }
          test -n "$PAUSE_PASSWORD" || { echo 'secret PAUSE_PASSWORD is not set' >&2; exit 1; }
          cpanm --notest CPAN::Uploader
          cpan-upload --user "$PAUSE_USER" --password "$PAUSE_PASSWORD" Protocol-IR-Code-*.tar.gz